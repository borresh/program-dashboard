spring:
  application:
    name: program-dashboard
  datasource:
    # No defaults, and no secret in the repository: an unset variable fails the
    # application at startup rather than silently connecting somewhere else.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate never touches it.
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    # One rule for the whole API: an optional value is absent, never null. springdoc
    # cannot express a nullable object reference correctly in OpenAPI 3.1, so a response
    # carrying nulls would produce a generated client that claims fields are `undefined`
    # while the wire sends `null`. Omitting them keeps the contract and the payload honest.
    default-property-inclusion: non_null

server:
  # Bind to loopback by default so a backend started outside Docker is not exposed
  # to the LAN. docker-compose overrides this to 0.0.0.0, because inside a container
  # the loopback interface is not reachable from the published port; the
  # localhost-only guarantee there comes from publishing to 127.0.0.1.
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs

program-dashboard:
  cors:
    allowed-origins: ${PROGRAM_DASHBOARD_CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
