server {
    listen 4200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Written at container start from the environment. Never cached, so changing
    # the backend URL or the human agent id only needs a container restart.
    location = /config.json {
        add_header Cache-Control "no-store" always;
    }

    # Hashed bundles are immutable.
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Angular owns routing; unknown paths return the shell rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
